server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Static assets with hashed filenames get long-lived caching.
    # Mirrors the SPA build output under /assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routing fallback: serve index.html for all non-file routes.
    # Equivalent to the firebase.json `** -> /index.html` rewrite.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't log or serve favicon/robots 404 noise
    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }
}
